[project]
name = "voice-full-duplex"
version = "0.1.0"
description = "Real-Time Micro-Turn Full Duplex Voice Engine with ModernBERT/Ettin Gatekeeper and Gemma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "accelerate>=0.34.0",
    "scikit-learn>=1.4.0",
    "huggingface_hub>=0.28.0",
    "peft>=0.13.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
serving = [
    "vllm>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "black>=24.0.0",
]

# Tell uv this is an application/workspace, not a library package to build
[tool.uv]
package = false
